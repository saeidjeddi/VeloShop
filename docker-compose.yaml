services:

  app:
    build: ./app
    container_name: app
    restart: always
    expose:
      - "8000"

    volumes:
      - type: bind
        source: ./app
        target: /app

      - type: bind
        source: ./volumes/media
        target: /volumes/media

      - type: bind
        source: ./volumes/assets
        target: /volumes/assets

    env_file:
      - .env

    depends_on:
      pgbouncer-primary:
        condition: service_healthy
      pgbouncer-replica:
        condition: service_healthy
      redis:
        condition: service_healthy


  nginx:
    build: ./nginx
    container_name: nginx
    restart: always
    ports:
      - "80:80"

    depends_on:
      - app

    volumes:
      - type: bind
        source: ./volumes/media
        target: /volumes/media

      - type: bind
        source: ./volumes/assets
        target: /volumes/assets

  redis:
    image: redis:8.10
    container_name: veloshop-redis
    restart: always

    command: redis-server --appendonly yes

    volumes:
      - ./volumes/redisdata:/data

    expose:
      - "6379"

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5


  postgres-primary:
    image: postgres:18
    container_name: veloshop-postgres-primary
    restart: always

    env_file:
      - .env

    ports:
      - "5432:5432"

    volumes:
      - ./volumes/dbdata-primary:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -p 5432 -U ${DB_USER} -d ${DB_NAME}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


  postgres-replica:
    image: postgres:18
    container_name: veloshop-postgres-replica
    restart: always

    env_file:
      - .env

    ports:
      - "5433:5432"

    volumes:
      - ./volumes/dbdata-replica:/var/lib/postgresql

    depends_on:
      postgres-primary:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -p 5432 -U ${DB_USER} -d ${DB_NAME}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


  pgbouncer-primary:
    image: edoburu/pgbouncer:latest
    container_name: veloshop-pgbouncer-primary
    restart: always

    environment:
      DB_HOST: postgres-primary
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}

      AUTH_TYPE: scram-sha-256

      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      RESERVE_POOL_SIZE: 5

    expose:
      - "5432"

    depends_on:
      postgres-primary:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -p 5432 -U ${DB_USER} -d ${DB_NAME}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


  pgbouncer-replica:
    image: edoburu/pgbouncer:latest
    container_name: veloshop-pgbouncer-replica
    restart: always

    environment:
      DB_HOST: postgres-replica
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}

      AUTH_TYPE: scram-sha-256

      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      RESERVE_POOL_SIZE: 5

    expose:
      - "5432"

    depends_on:
      postgres-replica:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -p 5432 -U ${DB_USER} -d ${DB_NAME}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5